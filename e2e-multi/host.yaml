# E2E-multi host config. Bootstrap peers come from the BOOTSTRAP_PEERS env
# var, which run.sh sets per host once the peer IDs are known.

defradb:
  url: "localhost:9181"
  keyring_secret: "e2e-test-secret"
  p2p:
    enabled: true
    bootstrap_peers: []
    listen_addr: "/ip4/0.0.0.0/tcp/9171"
    max_retries: 5
    retry_base_delay_ms: 1000
    reconnect_interval_ms: 10000
    enable_auto_reconnect: true
    # Explicit libp2p resource-manager limits, so the harness measures the configured path
    # rather than libp2p's autoscaled one.
    #
    # resource_memory_mib is sized to NODE_MEM_LIMIT (3g) and GEN_/HOST_GOMEMLIMIT (2GiB), NOT to
    # the production value of 10240 - these nodes are 3g containers and six of them share the
    # Docker VM. The stream and fd counts match production, since that is where the headroom that
    # matters lives and it costs no memory: 1024MiB/2048fd/4096str resolves to 4224 inbound
    # streams per peer, against 2304 for a node autoscaling off a 16GiB machine.
    #
    # These knobs cannot raise the per-stream (16MiB), per-protocol-per-peer (16MiB) or
    # per-connection (32MiB) memory ceilings, which are constant at every budget.
    resource_memory_mib: 1024
    resource_file_descriptors: 2048
    max_streams_per_peer: 4096
  store:
    path: "./.defra"
    block_cache_mb: 128
    memtable_mb: 32
    index_cache_mb: 64
    num_compactors: 2
    value_log_file_size_mb: 64

shinzo:
  minimum_attestations: 1
  start_height: 0
  hub_base_url: testnet.shinzo.network
  wait_for_gaps: true
  max_gap_size: 1000
  cache_queue_size: 5000
  view_inactivity_timeout: "1h"
  view_cleanup_interval: "10m"
  view_worker_count: 4
  view_queue_size: 1000
  batch_processing_enabled: true
  batch_max_views_per_job: 50
  batch_query_cache_size: 100
  batch_writer_count: 4
  batch_size: 100
  batch_flush_interval: 100
  use_block_signatures: true
  doc_worker_count: 8
  doc_queue_size: 5000
  event_filter:
    enabled: false

pruner:
  enabled: false

schema:
  indexer_schema_endpoint: /api/v1/schema
  http_client_timeout_secs: 30

logger:
  development: true
  level: "info"

host:
  lens_registry_path: "./.defra/lens"
  health_server_port: 8080
  open_browser_on_start: false
  snapshot:
    enabled: false
